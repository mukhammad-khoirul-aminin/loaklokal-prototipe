<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pengajuan Sukses - LoakLokal</title>

  <!-- Link CSS -->
  <link rel="stylesheet" href="css/sukses-tiket.css">
  <link rel="stylesheet" href="css/mobile.css">

  <!-- Link Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
  />
</head>
<body>
  <header>
    <div class="mainwrap-header">
      <div class="wrap-header">
        <a href="beranda.html"><i class="fa-solid fa-arrow-left iconarrowleft"></i></a>
        <img src="assets/images/LOGO.png" alt="logo-website" class="logoweb-detailbarang">
        <h2 class="title-uploadbarang">Loak Lokal</h2>
      </div>
    </div>

  <main>
    <section class="desktop-card">
      
      <div class="icon-success">✔</div>
      <h2>PENGAJUAN BERHASIL!!</h2>

      <!-- Tiket Horizontal ala Desktop -->
      <article class="ticket-card">
        <div class="ticket-info">
          <h3>TIKET COD #LKL-89234</h3>
          <p><strong>Spot:</strong> Pos Satpam Kampus UNP</p>
          <p><strong>Waktu:</strong> Hari Ini 16.30</p>
          <p><strong>Status:</strong> Menunggu Konfirmasi</p>
        </div>
        
        <div class="qr-section">
          <h4>QR CODE TIKET</h4>
          <!-- Ganti dengan path QR code asli Anda -->
          <img src="./assets/images/qr-code-tiket.webp" alt="QR Code Tiket">
        </div>
      </article>

      <!-- Tombol Aksi Lanjutan -->
      <div class="action-buttons">
        <!-- Mengarah langsung ke pesan.html -->
        <a href="pesan.html">
          <button type="button" class="btn btn-primary">Buka In-App Chat</button>
        </a>
        <a href="beranda.html">
          <button type="button" class="btn btn-secondary">Kembali Ke Beranda</button>
        </a>
      </div>

    </section>
  </main>

</body>
</html>
